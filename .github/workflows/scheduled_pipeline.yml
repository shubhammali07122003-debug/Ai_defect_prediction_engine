name: Scheduled Defect Engine Pipeline

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas sqlalchemy psycopg2-binary python-dotenv lizard GitPython radon

      - name: Ensure Target Repository Cloned
        run: |
          mkdir -p data/raw
          if [ ! -d "data/raw/flask" ]; then
            git clone https://github.com/pallets/flask.git data/raw/flask
          fi

      - name: Execute Mining & Metrics Pipelines
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python src/mining/github_miner.py
          python src/mining/code_metrics.py